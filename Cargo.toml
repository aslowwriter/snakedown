[package]
name         = "snakedown"
version      = "0.3.0"
authors      = ["Sam Vente <savente93@proton.me>"]
edition      = "2024"
rust-version = "1.91"
description  = "This is a snakedown. Hand over your docs, nice and clean, and nobody gets confused."
readme       = "README.md"
license      = "MIT"

documentation = "https://docs.rs/snakedown"
repository    = "https://github.com/savente93/snakedown"

[lib]
path  = "src/lib.rs"
bench = false

[[bin]]
path  = "src/main.rs"
name  = "snakedown"
bench = false

[profile.release]
debug         = 0
lto           = "fat"
codegen-units = 1
strip         = "symbols"

[profile.dev]
debug = 0

[profile.bench]
inherits = "release"
debug    = 2         # necessary for many profilers
strip    = "none"    #only affects binary size, not runtime, but makes profiling easier

[[bench]]
name    = "test_pkg"
harness = false

[dependencies]
base64              = "0.22.1"
clap                = { version = "4", features = ["derive", "unicode", "cargo"] }
clap-verbosity-flag = { version = "3.0.3", features = ["tracing"] }
color-eyre          = "0.6"
console             = "0.16.2"
dialoguer           = "0.12.0"
edit-distance       = "2.2.2"
flate2              = "1.1.2"
jupyter-protocol    = "2.0.0"

lazy-regex        = "3.4.1"
nbformat          = "1.0.0"
pyproject-toml    = "0.13.7"
reqwest           = { version = "0.12.20", features = ["blocking"] }
rustpython-parser = "0.4.0"

serde = { version = "1", features = ["derive"] }
strum = { version = "0.27.1", features = ["derive", "strum_macros"] }
tera  = "1.20.1"

tokio = { version = "1.45", features = [
  "rt",
  "rt-multi-thread",
  "io-util",
  "io-std",
  "time",
  "process",
  "macros",
  "fs",
  "parking_lot",
  "sync",
] }

toml               = "0.9.2"
tracing            = { version = "0", features = ["attributes"] }
tracing-error      = "0"
tracing-subscriber = "0"
url                = "2.5.4"
walkdir            = "2.5.0"

[dev-dependencies]
assert_cmd        = "2.0.17"
assert_fs         = "1.1.3"
criterion         = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
pretty_assertions = "1"
tempfile          = "3.20.0"
tracing-test      = "0.2.5"

# please tell me what to do Clippy-senpai
[lints.clippy]
single_match               = "warn"
single_match_else          = "warn"
needless_match             = "warn"
needless_late_init         = "warn"
redundant_pattern_matching = "warn"
redundant_pattern          = "warn"
redundant_guards           = "warn"
collapsible_match          = "warn"
match_single_binding       = "warn"
match_same_arms            = "warn"
match_ref_pats             = "warn"
match_bool                 = "warn"
needless_bool              = "deny"
unwrap_used                = "warn"
expect_used                = "warn"
